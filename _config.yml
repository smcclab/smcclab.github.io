title: SMCClab
tagline: Sound, Music, and Creative Computing at ANU
email: charles.martin@anu.edu.au
description: >- # this means to ignore newlines until "baseurl:"
  The SMCClab is focussed on research into sound music and creative computing.
  We are based at the Australian National University School of computing.
  The lab PI is Dr Charles Martin.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://smcclab.au" # the base hostname & protocol for your site
logo: /assets/lab-logo/smcclab-black.png

tags_path: /tags/

# Layouts, includes and styles live in this repo (_layouts, _includes,
# assets/css/main.css on top of Pico CSS in assets/vendor/pico).
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - scripts/
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

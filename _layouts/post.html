---
layout: default
---
<article class="content">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
    {%- if page.tags.size > 0 %} &middot;
    {% for tag in page.tags %}<a href="{{ site.tags_path | relative_url }}#{{ tag | slugify }}">{{ tag | slugify }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}
    {%- endif %}
  </p>
  {{ content }}
</article>

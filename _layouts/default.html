<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/vendor/pico/pico.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/lab-logo/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body class="layout-{{ page.layout }}">
  <header class="container">
    <nav aria-label="Main">
      <ul>
        <li>
          <a class="logo" href="{{ '/' | relative_url }}">
            <picture>
              <source srcset="{{ '/assets/lab-logo/smcclab-white.png' | relative_url }}" media="(prefers-color-scheme: dark)">
              <img src="{{ '/assets/lab-logo/smcclab-black.png' | relative_url }}" alt="{{ site.title }}: {{ site.tagline }}">
            </picture>
          </a>
        </li>
      </ul>
      <ul>
        {% for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="container">
    <small>&copy; {{ site.title }} {{ site.time | date: '%Y' }} &middot; <a href="https://comp.anu.edu.au">ANU School of Computing</a></small>
    <ul>
      <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      <li><a href="{{ '/alumni/' | relative_url }}">Alumni</a></li>
      <li><a href="{{ '/archive/' | relative_url }}">Archive</a></li>
      <li><a href="{{ '/tags/' | relative_url }}">Tags</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
  </footer>
</body>
</html>
